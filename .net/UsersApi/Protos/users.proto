syntax = "proto3";

option csharp_namespace = "UsersApi";

package users;

service UserService {
  rpc GetById(GetUserByIdRequest) returns (UserResponse);

  rpc GetAll(GetAllUsersRequest) returns (GetAllUsersResponse);

  rpc Create(CreateUserRequest) returns (UserResponse);
}

message User {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
}

message GetUserByIdRequest {
  int64 id = 1;
}

message GetAllUsersRequest {
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
}

message UserResponse {
  User user = 1;
}

message GetAllUsersResponse {
  repeated User users = 1;
}